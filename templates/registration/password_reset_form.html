{% extends "base.html" %}
{% block title %}Reset password | University Library{% endblock %}
{% block content %}
  <h1>Reset password</h1>
  <p>Enter your account email address to request a password reset.</p>
  <form method="post" class="row g-3">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="col-12"><button class="btn btn-primary" type="submit">Send reset link</button></div>
  </form>
{% endblock %}

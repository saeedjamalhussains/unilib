{% extends "base.html" %}
{% block title %}Choose a new password | University Library{% endblock %}
{% block content %}
  <h1>Choose a new password</h1>
  {% if validlink %}
    <form method="post" class="row g-3">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="col-12"><button class="btn btn-primary" type="submit">Set password</button></div>
    </form>
  {% else %}
    <p>This password reset link is invalid or has expired.</p>
  {% endif %}
{% endblock %}
